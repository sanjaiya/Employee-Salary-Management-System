<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Departments</title>

    {% load static %}
    <link rel="stylesheet" href="{% static 'department_list.css' %}">
</head>

<body class="department-list-page">

    <div class="navbar">

        <div class="logo">
            Salary Management
        </div>

        <div class="nav-links">
            <a href="{% url 'dashboard' %}">Dashboard</a>
            <a href="{% url 'employee_list' %}">Employees</a>
            <a href="{% url 'salary_list' %}">Salary</a>
            <a href="{% url 'leave_list' %}">Leaves</a>
            <a href="{% url 'logout' %}">Logout</a>
        </div>

    </div>

    <div class="container">

        <div class="top-section">

            <h1>Department Management</h1>

            <a href="{% url 'department_add' %}" class="add-btn">
                + Add Department
            </a>

        </div>

        <div class="table-box">

            <table>

                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Department Name</th>
                        <th>Actions</th>
                    </tr>
                </thead>

                <tbody>

                    {% for department in departments %}

                    <tr>

                        <td>{{ department.id }}</td>

                        <td>{{ department.dept_name }}</td>

                        <td>

                            <a
                                href="{% url 'department_edit' department.id %}"
                                class="edit-btn">
                                Edit
                            </a>

                            <a
                                href="{% url 'department_delete' department.id %}"
                                class="delete-btn">
                                Delete
                            </a>

                        </td>

                    </tr>

                    {% empty %}

                    <tr>
                        <td colspan="3" class="empty">
                            No departments found.
                        </td>
                    </tr>

                    {% endfor %}

                </tbody>

            </table>

        </div>

    </div>

</body>

</html>
