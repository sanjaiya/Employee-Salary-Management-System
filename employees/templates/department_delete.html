{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Delete Department</title>

    <link rel="stylesheet" href="{% static 'department_delete.css' %}">
</head>

<body class="department-delete-page">

    <div class="delete-container">

        <div class="delete-box">

            <h1>Delete Department</h1>

            <p>
                Are you sure you want to delete
                <strong>{{ department.dept_name }}</strong>?
            </p>

            <form method="POST">

                {% csrf_token %}

                <button type="submit">
                    Yes, Delete
                </button>

                <a href="{% url 'department_list' %}">
                    Cancel
                </a>

            </form>

        </div>

    </div>

</body>

</html>
