{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Delete Salary</title>

    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>

<body class="salary-delete-page">

    <div class="container">

        <h1> Delete Salary</h1>

        <p>
            Are you sure you want to delete the salary record for
            <strong>{{ salary.employee.name }}</strong>?
        </p>

        <form method="POST">
            {% csrf_token %}

            <button type="submit">
                Yes, Delete
            </button>

            <a href="{% url 'salary_list' %}" class="cancel">
                Cancel
            </a>
        </form>

    </div>

</body>

</html>
